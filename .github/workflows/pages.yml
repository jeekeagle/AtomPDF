name: Deploy PDF Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Check access secret
        env:
          ACCESS_HASH: ${{ secrets.ACCESS_PASSWORD_HASH }}
        run: |
          if [ -z "$ACCESS_HASH" ]; then
            echo "::error::仓库缺少密钥 ACCESS_PASSWORD_HASH，站点会以无密码状态发布。请先创建该密钥。"
            exit 1
          fi
      - name: Build static site
        env:
          VITE_ACCESS_HASH: ${{ secrets.ACCESS_PASSWORD_HASH }}
        run: npm run build:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
